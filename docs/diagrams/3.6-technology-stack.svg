<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#141c2f" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ts-title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ts-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .col-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .card-ver { font-family: monospace, system-ui; font-size: 10px; font-weight: 700; fill: #38bdf8; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #cbd5e1; line-height: 1.4; }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" rx="16" fill="url(#bgGrad6)" />
  <rect x="1" y="1" width="1198" height="798" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="18" class="ts-title">PanicDrop — 3.6: Full-Stack Technology Stack &amp; Tooling Ecosystem</text>
    <text x="0" y="38" class="ts-sub">Enterprise Engineering Standards • Production Cloud Infrastructure • Sub-Second Catalog Performance Matrix</text>
  </g>

  <!-- 4 MAIN COLUMNS (Width: 265 each, Spacing: 20) -->

  <!-- COLUMN 1: CLIENT FRONTEND TIER (x: 40) -->
  <g transform="translate(40, 85)" filter="url(#shadow6)">
    <rect width="265" height="680" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="265" height="32" rx="10" fill="#2563eb" />
    <rect y="20" width="265" height="12" fill="#2563eb" />
    <text x="132" y="22" class="col-header">1. FRONTEND TIER</text>

    <!-- Item 1: React 18 -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">React</text>
      <text x="175" y="24" class="card-ver">v18.3.1</text>
      <text x="12" y="44" class="card-desc">• Declarative component model</text>
      <text x="12" y="60" class="card-desc">• Concurrent Mode &amp; Fast Virtual DOM</text>
      <text x="12" y="76" class="card-desc">• Unified Context State Management</text>
    </g>

    <!-- Item 2: Vite 5.4 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Vite Bundler</text>
      <text x="175" y="24" class="card-ver">v5.4.11</text>
      <text x="12" y="44" class="card-desc">• Native ES Modules development</text>
      <text x="12" y="60" class="card-desc">• Sub-second Hot Module Replacement</text>
      <text x="12" y="76" class="card-desc">• Rollup-optimized production chunks</text>
    </g>

    <!-- Item 3: Tailwind CSS 3.4 -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Tailwind CSS</text>
      <text x="175" y="24" class="card-ver">v3.4.16</text>
      <text x="12" y="44" class="card-desc">• Zero runtime overhead utility CSS</text>
      <text x="12" y="60" class="card-desc">• Custom Indian theme palette</text>
      <text x="12" y="76" class="card-desc">• Mobile-first responsive layouts</text>
    </g>

    <!-- Item 4: Recharts 3.10 -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Recharts</text>
      <text x="175" y="24" class="card-ver">v3.10.1</text>
      <text x="12" y="44" class="card-desc">• Declarative SVG analytics charts</text>
      <text x="12" y="60" class="card-desc">• Day/Week/Month interactive toggle</text>
      <text x="12" y="76" class="card-desc">• Revenue &amp; demand visualizations</text>
    </g>

    <!-- Item 5: React Router & Lucide -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Router &amp; Icons</text>
      <text x="160" y="24" class="card-ver">v6.28 / 0.475</text>
      <text x="12" y="44" class="card-desc">• React Router DOM 6 ProtectedRoute</text>
      <text x="12" y="60" class="card-desc">• Role clearance guard (/admin)</text>
      <text x="12" y="76" class="card-desc">• Lucide React modern icon set</text>
    </g>
  </g>

