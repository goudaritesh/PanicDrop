    <!-- Item 1: Node.js LTS -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Node.js Runtime</text>
      <text x="175" y="24" class="card-ver">v22 LTS</text>
      <text x="12" y="44" class="card-desc">• Event-driven non-blocking I/O</text>
      <text x="12" y="60" class="card-desc">• High-throughput concurrent requests</text>
      <text x="12" y="76" class="card-desc">• Native ES Modules execution</text>
    </g>

    <!-- Item 2: Express.js 4.21 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Express.js</text>
      <text x="175" y="24" class="card-ver">v4.21.2</text>
      <text x="12" y="44" class="card-desc">• Modular RESTful API routers</text>
      <text x="12" y="60" class="card-desc">• Express JSON parser &amp; error handlers</text>
      <text x="12" y="76" class="card-desc">• Routes: /auth, /products, /orders</text>
    </g>

    <!-- Item 3: JWT (jsonwebtoken) -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">JSON Web Tokens</text>
      <text x="175" y="24" class="card-ver">v9.0.2</text>
      <text x="12" y="44" class="card-desc">• Stateless cryptographic tokens</text>
      <text x="12" y="60" class="card-desc">• 30-day expiration policy</text>
      <text x="12" y="76" class="card-desc">• Secure Bearer header transport</text>
    </g>

    <!-- Item 4: BcryptJS 2.4 -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">BcryptJS</text>
      <text x="175" y="24" class="card-ver">v2.4.3</text>
      <text x="12" y="44" class="card-desc">• 10 salt rounds one-way hash</text>
      <text x="12" y="60" class="card-desc">• Pre-save schema middleware hooks</text>
      <text x="12" y="76" class="card-desc">• Protection against rainbow tables</text>
    </g>

