      <text x="12" y="24" class="card-title">Vercel Cloud</text>
      <text x="175" y="24" class="card-ver">Global Edge</text>
      <text x="12" y="44" class="card-desc">• Single Page Application edge host</text>
      <text x="12" y="60" class="card-desc">• Automated continuous deployment</text>
      <text x="12" y="76" class="card-desc">• vercel.json SPA deep route rewrites</text>
    </g>

    <!-- Item 2: Render PaaS -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Render PaaS</text>
      <text x="175" y="24" class="card-ver">Web Service</text>
      <text x="12" y="44" class="card-desc">• Linux containerized Node runtime</text>
      <text x="12" y="60" class="card-desc">• Auto-deploy on main branch push</text>
      <text x="12" y="76" class="card-desc">• Environment variables management</text>
    </g>

    <!-- Item 3: Flipkart Dataset -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Flipkart Sales Data</text>
      <text x="175" y="24" class="card-ver">10k Dataset</text>
      <text x="12" y="44" class="card-desc">• 6 high-demand consumer departments</text>
      <text x="12" y="60" class="card-desc">• Realistic Indian pricing &amp; discounts</text>
      <text x="12" y="76" class="card-desc">• Authentic brand &amp; spec distributions</text>
    </g>

    <!-- Item 4: Scikit-Learn Demand -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Demand Forecasting</text>
      <text x="175" y="24" class="card-ver">ML Engine</text>
      <text x="12" y="44" class="card-desc">• Sales velocity run-rate calculations</text>
      <text x="12" y="60" class="card-desc">• Procured quantity restocking model</text>
      <text x="12" y="76" class="card-desc">• Out-of-stock prevention heuristics</text>
    </g>

    <!-- Item 5: Git & Tooling -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Tooling &amp; Quality</text>
      <text x="175" y="24" class="card-ver">Git / Oxlint</text>
      <text x="12" y="44" class="card-desc">• Git branching &amp; pull request review</text>
      <text x="12" y="60" class="card-desc">• Oxlint static AST linting</text>
      <text x="12" y="76" class="card-desc">• PostCSS autoprefixer compilation</text>
    </g>
