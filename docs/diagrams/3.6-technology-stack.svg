      <text x="175" y="24" class="card-ver">Browser</text>
      <text x="12" y="44" class="card-desc">• panicdrop_token (JWT Bearer)</text>
      <text x="12" y="60" class="card-desc">• panicdrop_cart (Offline basket sync)</text>
      <text x="12" y="76" class="card-desc">• panicdrop_wishlist (Saved items)</text>
    </g>
  </g>

  <!-- COLUMN 4: DEVOPS & ANALYTICS TIER (x: 895) -->
  <g transform="translate(895, 85)" filter="url(#shadow6)">
