<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .ts-title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
    .ts-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
    .col-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
    .card-ver { font-family: monospace, system-ui; font-size: 10px; font-weight: 800; fill: #1d4ed8; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; line-height: 1.4; }
  </style>

  <!-- Clean White Canvas -->
  <rect width="1200" height="800" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="18" class="ts-title">PanicDrop &#x2014; 3.6: Full-Stack Technology Stack &amp; Tooling Ecosystem</text>
    <text x="0" y="38" class="ts-sub">Enterprise Engineering Standards &#x2022; Production Cloud Infrastructure &#x2022; Sub-Second Catalog Performance Matrix</text>
  </g>

  <!-- 4 MAIN COLUMNS -->

  <!-- COLUMN 1: CLIENT FRONTEND TIER (x: 40) -->
  <g transform="translate(40, 85)" filter="url(#shadow6)">
    <rect width="265" height="680" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <rect width="265" height="32" rx="10" fill="#2563eb" />
    <rect y="20" width="265" height="12" fill="#2563eb" />
    <text x="132" y="22" class="col-header">1. FRONTEND TIER</text>

    <!-- Item 1: React 18 -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">React</text>
      <text x="175" y="24" class="card-ver">v18.3.1</text>
      <text x="12" y="44" class="card-desc">&#x2022; Declarative component model</text>
      <text x="12" y="60" class="card-desc">&#x2022; Concurrent Mode &amp; Fast Virtual DOM</text>
      <text x="12" y="76" class="card-desc">&#x2022; Unified Context State Management</text>
    </g>

    <!-- Item 2: Vite 5.4 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Vite Bundler</text>
      <text x="175" y="24" class="card-ver">v5.4.11</text>
      <text x="12" y="44" class="card-desc">&#x2022; Native ES Modules development</text>
      <text x="12" y="60" class="card-desc">&#x2022; Sub-second Hot Module Replacement</text>
      <text x="12" y="76" class="card-desc">&#x2022; Rollup-optimized production chunks</text>
    </g>

    <!-- Item 3: Tailwind CSS 3.4 -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Tailwind CSS</text>
      <text x="175" y="24" class="card-ver">v3.4.16</text>
      <text x="12" y="44" class="card-desc">&#x2022; Zero runtime overhead utility CSS</text>
      <text x="12" y="60" class="card-desc">&#x2022; Custom Indian theme palette</text>
      <text x="12" y="76" class="card-desc">&#x2022; Mobile-first responsive layouts</text>
    </g>

    <!-- Item 4: Recharts 3.10 -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Recharts</text>
      <text x="175" y="24" class="card-ver">v3.10.1</text>
      <text x="12" y="44" class="card-desc">&#x2022; Declarative SVG analytics charts</text>
      <text x="12" y="60" class="card-desc">&#x2022; Day/Week/Month interactive toggle</text>
      <text x="12" y="76" class="card-desc">&#x2022; Revenue &amp; demand visualizations</text>
    </g>

    <!-- Item 5: React Router & Lucide -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Router &amp; Icons</text>
      <text x="155" y="24" class="card-ver">v6.28 / 0.47</text>
      <text x="12" y="44" class="card-desc">&#x2022; React Router DOM 6 ProtectedRoute</text>
      <text x="12" y="60" class="card-desc">&#x2022; Role clearance guard (/admin)</text>
      <text x="12" y="76" class="card-desc">&#x2022; Lucide React modern vector icons</text>
    </g>
  </g>

  <!-- COLUMN 2: BACKEND SERVER TIER (x: 325) -->
  <g transform="translate(325, 85)" filter="url(#shadow6)">
    <rect width="265" height="680" rx="10" fill="#f8fafc" stroke="#c4b5fd" stroke-width="1.5" />
    <rect width="265" height="32" rx="10" fill="#7c3aed" />
    <rect y="20" width="265" height="12" fill="#7c3aed" />
    <text x="132" y="22" class="col-header">2. BACKEND API TIER</text>

    <!-- Item 1: Node.js LTS -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Node.js Runtime</text>
      <text x="175" y="24" class="card-ver" fill="#6d28d9">v22 LTS</text>
      <text x="12" y="44" class="card-desc">&#x2022; Event-driven non-blocking I/O</text>
      <text x="12" y="60" class="card-desc">&#x2022; High-throughput concurrent requests</text>
      <text x="12" y="76" class="card-desc">&#x2022; Native ES Modules execution</text>
    </g>

    <!-- Item 2: Express.js 4.21 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Express.js</text>
      <text x="175" y="24" class="card-ver" fill="#6d28d9">v4.21.2</text>
      <text x="12" y="44" class="card-desc">&#x2022; Modular RESTful API routers</text>
      <text x="12" y="60" class="card-desc">&#x2022; Express JSON parser &amp; error handlers</text>
      <text x="12" y="76" class="card-desc">&#x2022; Routes: /auth, /products, /orders</text>
    </g>

    <!-- Item 3: JWT -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">JSON Web Tokens</text>
      <text x="175" y="24" class="card-ver" fill="#6d28d9">v9.0.2</text>
      <text x="12" y="44" class="card-desc">&#x2022; Stateless cryptographic tokens</text>
      <text x="12" y="60" class="card-desc">&#x2022; 30-day expiration policy</text>
      <text x="12" y="76" class="card-desc">&#x2022; Secure Bearer header transport</text>
    </g>

    <!-- Item 4: BcryptJS 2.4 -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">BcryptJS</text>
      <text x="175" y="24" class="card-ver" fill="#6d28d9">v2.4.3</text>
      <text x="12" y="44" class="card-desc">&#x2022; 10 salt rounds one-way hash</text>
      <text x="12" y="60" class="card-desc">&#x2022; Pre-save schema middleware hooks</text>
      <text x="12" y="76" class="card-desc">&#x2022; Protection against rainbow tables</text>
    </g>

    <!-- Item 5: Morgan & CORS -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Middleware Tools</text>
      <text x="170" y="24" class="card-ver" fill="#6d28d9">v1.10/2.8</text>
      <text x="12" y="44" class="card-desc">&#x2022; Morgan HTTP request access logging</text>
      <text x="12" y="60" class="card-desc">&#x2022; CORS origin whitelist security</text>
      <text x="12" y="76" class="card-desc">&#x2022; dotenv configuration management</text>
    </g>
  </g>

  <!-- COLUMN 3: PERSISTENCE & STORAGE TIER (x: 610) -->
  <g transform="translate(610, 85)" filter="url(#shadow6)">
    <rect width="265" height="680" rx="10" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.5" />
    <rect width="265" height="32" rx="10" fill="#059669" />
    <rect y="20" width="265" height="12" fill="#059669" />
    <text x="132" y="22" class="col-header">3. PERSISTENCE TIER</text>

    <!-- Item 1: MongoDB -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">MongoDB Atlas</text>
      <text x="175" y="24" class="card-ver" fill="#047857">v7.0+</text>
      <text x="12" y="44" class="card-desc">&#x2022; Cloud NoSQL document database</text>
      <text x="12" y="60" class="card-desc">&#x2022; High availability replica clusters</text>
      <text x="12" y="76" class="card-desc">&#x2022; JSON-native schema flexibility</text>
    </g>

    <!-- Item 2: Mongoose 8.9 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Mongoose ODM</text>
      <text x="175" y="24" class="card-ver" fill="#047857">v8.9.5</text>
      <text x="12" y="44" class="card-desc">&#x2022; Strict schema validation &amp; types</text>
      <text x="12" y="60" class="card-desc">&#x2022; Compound query indexing ({cat, price})</text>
      <text x="12" y="76" class="card-desc">&#x2022; Virtual properties &amp; pre-save hooks</text>
    </g>

    <!-- Item 3: Embedded Store -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Embedded Store</text>
      <text x="165" y="24" class="card-ver" fill="#047857">store.js</text>
      <text x="12" y="44" class="card-desc">&#x2022; Instant fallback if MongoDB drops</text>
      <text x="12" y="60" class="card-desc">&#x2022; Pre-seeded with 10k items</text>
      <text x="12" y="76" class="card-desc">&#x2022; Sub-10ms query execution</text>
    </g>

    <!-- Item 4: ES6 Proxy Pattern -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">ES6 Proxy Pattern</text>
      <text x="175" y="24" class="card-ver" fill="#047857">Core JS</text>
      <text x="12" y="44" class="card-desc">&#x2022; Transparent target dispatching</text>
      <text x="12" y="60" class="card-desc">&#x2022; Dynamically selects Mongoose/Memory</text>
      <text x="12" y="76" class="card-desc">&#x2022; Guarantees 100% demo uptime</text>
    </g>

    <!-- Item 5: Web LocalStorage -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Web Storage API</text>
      <text x="175" y="24" class="card-ver" fill="#047857">Browser</text>
      <text x="12" y="44" class="card-desc">&#x2022; panicdrop_token (JWT Bearer)</text>
      <text x="12" y="60" class="card-desc">&#x2022; panicdrop_cart (Offline basket sync)</text>
      <text x="12" y="76" class="card-desc">&#x2022; panicdrop_wishlist (Saved items)</text>
    </g>
  </g>

  <!-- COLUMN 4: DEVOPS & ANALYTICS TIER (x: 895) -->
  <g transform="translate(895, 85)" filter="url(#shadow6)">
    <rect width="265" height="680" rx="10" fill="#f8fafc" stroke="#fde68a" stroke-width="1.5" />
    <rect width="265" height="32" rx="10" fill="#d97706" />
    <rect y="20" width="265" height="12" fill="#d97706" />
    <text x="132" y="22" class="col-header">4. DEVOPS &amp; ML TIER</text>

    <!-- Item 1: Vercel -->
    <g transform="translate(15, 48)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Vercel Cloud</text>
      <text x="170" y="24" class="card-ver" fill="#b45309">Global Edge</text>
      <text x="12" y="44" class="card-desc">&#x2022; Single Page Application edge host</text>
      <text x="12" y="60" class="card-desc">&#x2022; Automated continuous deployment</text>
      <text x="12" y="76" class="card-desc">&#x2022; vercel.json SPA deep route rewrites</text>
    </g>

    <!-- Item 2: Render PaaS -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Render PaaS</text>
      <text x="160" y="24" class="card-ver" fill="#b45309">Web Service</text>
      <text x="12" y="44" class="card-desc">&#x2022; Linux containerized Node runtime</text>
      <text x="12" y="60" class="card-desc">&#x2022; Auto-deploy on main branch push</text>
      <text x="12" y="76" class="card-desc">&#x2022; Environment variables management</text>
    </g>

    <!-- Item 3: Flipkart Dataset -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Flipkart Sales Data</text>
      <text x="170" y="24" class="card-ver" fill="#b45309">10k Dataset</text>
      <text x="12" y="44" class="card-desc">&#x2022; 6 high-demand consumer departments</text>
      <text x="12" y="60" class="card-desc">&#x2022; Realistic Indian pricing &amp; discounts</text>
      <text x="12" y="76" class="card-desc">&#x2022; Authentic brand &amp; spec distributions</text>
    </g>

    <!-- Item 4: Demand Forecasting -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Demand Forecasting</text>
      <text x="170" y="24" class="card-ver" fill="#b45309">ML Engine</text>
      <text x="12" y="44" class="card-desc">&#x2022; Sales velocity run-rate calculations</text>
      <text x="12" y="60" class="card-desc">&#x2022; Procured quantity restocking model</text>
      <text x="12" y="76" class="card-desc">&#x2022; Out-of-stock prevention heuristics</text>
    </g>

    <!-- Item 5: Git & Tooling -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="card-title">Tooling &amp; Quality</text>
      <text x="160" y="24" class="card-ver" fill="#b45309">Git / Oxlint</text>
      <text x="12" y="44" class="card-desc">&#x2022; Git branching &amp; pull request review</text>
      <text x="12" y="60" class="card-desc">&#x2022; Oxlint static AST linting</text>
      <text x="12" y="76" class="card-desc">&#x2022; PostCSS autoprefixer compilation</text>
    </g>
  </g>
</svg>
