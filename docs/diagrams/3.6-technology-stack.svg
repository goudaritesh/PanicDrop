      <text x="175" y="24" class="card-ver">v7.0+</text>
      <text x="12" y="44" class="card-desc">• Cloud NoSQL document database</text>
      <text x="12" y="60" class="card-desc">• High availability replica clusters</text>
      <text x="12" y="76" class="card-desc">• JSON-native schema flexibility</text>
    </g>

    <!-- Item 2: Mongoose 8.9 -->
    <g transform="translate(15, 155)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Mongoose ODM</text>
      <text x="175" y="24" class="card-ver">v8.9.5</text>
      <text x="12" y="44" class="card-desc">• Strict schema validation &amp; types</text>
      <text x="12" y="60" class="card-desc">• Compound query indexing ({cat, price})</text>
      <text x="12" y="76" class="card-desc">• Virtual properties &amp; pre-save hooks</text>
    </g>

    <!-- Item 3: Embedded In-Memory Store -->
    <g transform="translate(15, 262)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">Embedded Store</text>
      <text x="165" y="24" class="card-ver">store.js</text>
      <text x="12" y="44" class="card-desc">• Instant fallback if MongoDB drops</text>
      <text x="12" y="60" class="card-desc">• Pre-seeded with 10k items</text>
      <text x="12" y="76" class="card-desc">• Sub-10ms query execution</text>
    </g>

    <!-- Item 4: ES6 Transparent Proxy -->
    <g transform="translate(15, 369)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" class="card-title">ES6 Proxy Pattern</text>
      <text x="175" y="24" class="card-ver">Core JS</text>
      <text x="12" y="44" class="card-desc">• Transparent target dispatching</text>
      <text x="12" y="60" class="card-desc">• Dynamically selects Mongoose/Memory</text>
      <text x="12" y="76" class="card-desc">• Guarantees 100% demo uptime</text>
    </g>

    <!-- Item 5: Web LocalStorage -->
    <g transform="translate(15, 476)">
      <rect width="235" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
