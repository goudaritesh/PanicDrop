<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <filter id="proxyShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="proxyArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="proxyArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="proxyArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <style>
    .px-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
    .px-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
    .px-card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .px-code { font-family: monospace, system-ui; font-size: 11px; fill: #0f172a; }
  </style>

  <!-- Clean White Canvas -->
  <rect width="1000" height="600" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="18" class="px-title">PanicDrop &#x2014; ES6 Transparent Database Proxy Architecture</text>
    <text x="0" y="38" class="px-sub">Zero-Downtime Dynamic Interceptor: Seamless Switching Between MongoDB Atlas &amp; High-Speed Memory Store</text>
  </g>

  <!-- Step 1: Controller Request -->
  <g transform="translate(40, 90)" filter="url(#proxyShadow)">
    <rect width="250" height="150" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2" />
    <rect width="250" height="28" rx="10" fill="#2563eb" />
    <rect y="18" width="250" height="10" fill="#2563eb" />
    <text x="16" y="19" class="px-card-title">1. Controller Invocation</text>
    <text x="16" y="52" class="px-code" fill="#1d4ed8">Product.find(query)</text>
    <text x="16" y="72" class="px-code" fill="#1d4ed8">User.findById(id)</text>
    <text x="16" y="92" class="px-code" fill="#1d4ed8">Order.create(data)</text>
    <text x="16" y="120" class="px-sub">&#x2022; Standard Mongoose syntax</text>
    <text x="16" y="136" class="px-sub">&#x2022; Zero controller changes needed</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="290" y1="165" x2="340" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#proxyArrowBlue)" />

  <!-- Step 2: ES6 Proxy Trap -->
  <g transform="translate(340, 75)" filter="url(#proxyShadow)">
    <rect width="320" height="180" rx="10" fill="#f8fafc" stroke="#6ee7b7" stroke-width="1.5" />
    <rect width="320" height="28" rx="10" fill="#059669" />
    <rect y="18" width="320" height="10" fill="#059669" />
    <text x="16" y="19" class="px-card-title">2. ES6 Proxy Interceptor (ProductProxy)</text>

    <text x="16" y="50" class="px-code" fill="#047857">new Proxy(MongooseProduct, {</text>
    <text x="24" y="70" class="px-code">get(target, prop) {</text>
    <text x="32" y="90" class="px-code">if (conn.readyState === 1)</text>
    <text x="44" y="110" class="px-code" fill="#1d4ed8">return target[prop]; // Live DB</text>
    <text x="32" y="130" class="px-code" fill="#b45309">return MemoryProduct[prop];</text>
    <text x="24" y="150" class="px-code">}</text>
    <text x="16" y="170" class="px-code">});</text>
  </g>

  <!-- Branching Arrows -->
  <path d="M 660 140 L 720 110" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#proxyArrow)" />
  <path d="M 660 190 L 720 220" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#proxyArrowAmber)" />

  <!-- Target 1: MongoDB Cluster -->
  <g transform="translate(720, 60)" filter="url(#proxyShadow)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5" />
    <rect width="240" height="24" rx="8" fill="#059669" />
    <rect y="14" width="240" height="10" fill="#059669" />
    <text x="16" y="17" class="px-card-title">PRIMARY: MongoDB Atlas</text>
    <text x="16" y="46" class="px-sub">&#x2022; readyState === 1 (Connected)</text>
    <text x="16" y="66" class="px-sub">&#x2022; Compound index execution</text>
    <text x="16" y="86" class="px-sub">&#x2022; Full-text regex search</text>
  </g>

  <!-- Target 2: In-Memory Database -->
  <g transform="translate(720, 190)" filter="url(#proxyShadow)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
    <rect width="240" height="24" rx="8" fill="#d97706" />
    <rect y="14" width="240" height="10" fill="#d97706" />
    <text x="16" y="17" class="px-card-title">FALLBACK: Embedded Store</text>
    <text x="16" y="46" class="px-sub">&#x2022; store.js memory arrays</text>
    <text x="16" y="66" class="px-sub">&#x2022; 10,000 pre-seeded Flipkart SKUs</text>
    <text x="16" y="86" class="px-sub">&#x2022; Sub-10ms query latency</text>
  </g>

  <!-- Bottom Comparison Card -->
  <g transform="translate(40, 325)" filter="url(#proxyShadow)">
    <rect width="920" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="20" y="28" class="px-card-title" fill="#1e293b" style="fill:#0f172a;">ENGINEERING BENEFITS OF DUAL-MODE PROXY PERSISTENCE</text>

    <!-- Column 1 -->
    <g transform="translate(20, 45)">
      <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="24" class="px-code" font-weight="700" fill="#047857">1. Zero Setup Overhead</text>
      <text x="15" y="48" class="px-sub">&#x2022; Developers clone the repo and run</text>
      <text x="15" y="66" class="px-sub">  immediately without needing a</text>
      <text x="15" y="84" class="px-sub">  local MongoDB daemon or Atlas URI.</text>
      <text x="15" y="112" class="px-sub">&#x2022; Auto-seeds 10,000 items in memory</text>
      <text x="15" y="130" class="px-sub">  within 200ms on first boot.</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(320, 45)">
      <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="24" class="px-code" font-weight="700" fill="#1d4ed8">2. High Demonstration Uptime</text>
      <text x="15" y="48" class="px-sub">&#x2022; If MongoDB Atlas has latency or</text>
      <text x="15" y="66" class="px-sub">  connection timeouts, server never</text>
      <text x="15" y="84" class="px-sub">  crashes or throws unhandled errors.</text>
      <text x="15" y="112" class="px-sub">&#x2022; Gracefully services catalog queries</text>
      <text x="15" y="130" class="px-sub">  and checkout operations.</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(620, 45)">
      <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="24" class="px-code" font-weight="700" fill="#b45309">3. Clean Code Decoupling</text>
      <text x="15" y="48" class="px-sub">&#x2022; Controllers call standard Mongoose</text>
      <text x="15" y="66" class="px-sub">  API (countDocuments, find, save).</text>
      <text x="15" y="94" class="px-sub">&#x2022; Proxy interceptor abstracts the</text>
      <text x="15" y="112" class="px-sub">  storage backend entirely away from</text>
      <text x="15" y="130" class="px-sub">  business domain rules.</text>
    </g>
  </g>
</svg>
