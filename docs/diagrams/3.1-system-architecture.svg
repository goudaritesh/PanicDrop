<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
    .tier-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    .conn-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #2563eb; }
  </style>

  <!-- Clean White Canvas -->
  <rect width="1200" height="800" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(40, 30)">
    <circle cx="20" cy="18" r="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <path d="M12 18 L20 10 L28 18 L20 26 Z" fill="#2563eb" />
    <text x="45" y="18" class="title">PanicDrop &#x2014; 3.1: System Architecture Blueprint</text>
    <text x="45" y="36" class="subtitle">Multi-Tier Micro-Modular Architecture &#x2022; Dual-Mode Persistence &#x2022; Indian Retail E-Commerce Engine</text>
  </g>

  <!-- TIER 1: CLIENT PRESENTATION TIER -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="1120" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1120" height="30" rx="10" fill="#2563eb" />
    <rect y="18" width="1120" height="12" fill="#2563eb" />
    <text x="16" y="20" class="tier-title">TIER 1: CLIENT PRESENTATION &amp; EDGE TIER (React 18 SPA + Vercel Global Edge)</text>

    <!-- Component 1 -->
    <rect x="20" y="42" width="250" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="32" y="62" class="box-title">React 18 Storefront (Vite 5.4)</text>
    <text x="32" y="80" class="box-desc">Landing, Catalog (10k items), PDP, Checkout</text>

    <!-- Component 2 -->
    <rect x="290" y="42" width="250" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="302" y="62" class="box-title">Context API (Auth, Cart, Wishlist)</text>
    <text x="302" y="80" class="box-desc">Optimistic Updates &amp; LocalStorage Sync</text>

    <!-- Component 3 -->
    <rect x="560" y="42" width="250" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="572" y="62" class="box-title">Admin Dashboard (Recharts 3.10)</text>
    <text x="572" y="80" class="box-desc">Real-time KPI Cards, Sales &amp; Demand Graphs</text>

    <!-- Component 4 -->
    <rect x="830" y="42" width="270" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="842" y="62" class="box-title">Vercel CDN Edge Network</text>
    <text x="842" y="80" class="box-desc">HTTPS, SPA Rewrites (vercel.json), Brotli</text>
  </g>

  <!-- Connectors Tier 1 to Tier 2 -->
  <line x1="600" y1="195" x2="600" y2="230" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="610" y="215" class="conn-label">REST API (JSON over HTTPS with Bearer JWT)</text>

  <!-- TIER 2: API GATEWAY & SECURITY MIDDLEWARE -->
  <g transform="translate(40, 230)" filter="url(#shadow)">
    <rect width="1120" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1120" height="30" rx="10" fill="#7c3aed" />
    <rect y="18" width="1120" height="12" fill="#7c3aed" />
    <text x="16" y="20" class="tier-title">TIER 2: API GATEWAY &amp; SECURITY MIDDLEWARE (Express.js 4.21 on Render PaaS)</text>

    <rect x="20" y="42" width="195" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" />
    <text x="32" y="60" class="box-title">CORS &amp; Body Parser</text>
    <text x="32" y="76" class="box-desc">Allowed Origins &amp; JSON parse</text>

    <line x1="215" y1="65" x2="245" y2="65" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="245" y="42" width="195" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" />
    <text x="257" y="60" class="box-title">Morgan Logger</text>
    <text x="257" y="76" class="box-desc">HTTP Traffic Inspection</text>

    <line x1="440" y1="65" x2="470" y2="65" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="470" y="42" width="205" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" />
    <text x="482" y="60" class="box-title">JWT Auth Guard (protect)</text>
    <text x="482" y="76" class="box-desc">HMAC-SHA256 Token Verify</text>

    <line x1="675" y1="65" x2="705" y2="65" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="705" y="42" width="195" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" />
    <text x="717" y="60" class="box-title">RBAC Guard (adminOnly)</text>
    <text x="717" y="76" class="box-desc">Role Enforcement Clearance</text>

    <line x1="900" y1="65" x2="930" y2="65" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="930" y="42" width="170" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" />
    <text x="942" y="60" class="box-title">Error Handler</text>
    <text x="942" y="76" class="box-desc">404 &amp; 500 Catch-All</text>
  </g>

  <!-- Connectors Tier 2 to Tier 3 -->
  <line x1="600" y1="330" x2="600" y2="365" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

  <!-- TIER 3: BUSINESS LOGIC & CONTROLLER SERVICES -->
  <g transform="translate(40, 365)" filter="url(#shadow)">
    <rect width="1120" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1120" height="30" rx="10" fill="#0891b2" />
    <rect y="18" width="1120" height="12" fill="#0891b2" />
    <text x="16" y="20" class="tier-title">TIER 3: CORE APPLICATION CONTROLLERS &amp; DOMAIN SERVICES</text>

    <rect x="20" y="42" width="205" height="56" rx="8" fill="#ffffff" stroke="#a5f3fc" stroke-width="1" />
    <text x="32" y="62" class="box-title">AuthController</text>
    <text x="32" y="80" class="box-desc">bcrypt (10 rounds), token issuance</text>

    <rect x="245" y="42" width="205" height="56" rx="8" fill="#ffffff" stroke="#a5f3fc" stroke-width="1" />
    <text x="257" y="62" class="box-title">ProductController</text>
    <text x="257" y="80" class="box-desc">Faceted filters, 10k pagination</text>

    <rect x="470" y="42" width="205" height="56" rx="8" fill="#ffffff" stroke="#a5f3fc" stroke-width="1" />
    <text x="482" y="62" class="box-title">OrderController</text>
    <text x="482" y="80" class="box-desc">Atomic stock decrement &amp; TRK-ID</text>

    <rect x="695" y="42" width="195" height="56" rx="8" fill="#ffffff" stroke="#a5f3fc" stroke-width="1" />
    <text x="707" y="62" class="box-title">UserController</text>
    <text x="707" y="80" class="box-desc">Profiles &amp; spend stats aggregate</text>

    <rect x="910" y="42" width="190" height="56" rx="8" fill="#ffffff" stroke="#a5f3fc" stroke-width="1" />
    <text x="922" y="62" class="box-title">AdminController</text>
    <text x="922" y="80" class="box-desc">KPI aggregation, monthly sales</text>
  </g>

  <!-- Connectors Tier 3 to Tier 4 -->
  <line x1="600" y1="475" x2="600" y2="510" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

  <!-- TIER 4: DATABASE PROXY & PERSISTENCE TIER -->
  <g transform="translate(40, 510)" filter="url(#shadow)">
    <rect width="1120" height="135" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1120" height="30" rx="10" fill="#059669" />
    <rect y="18" width="1120" height="12" fill="#059669" />
    <text x="16" y="20" class="tier-title">TIER 4: DUAL-MODE PERSISTENCE ARCHITECTURE (ES6 Proxy Abstraction)</text>

    <rect x="20" y="42" width="370" height="80" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" />
    <text x="32" y="62" class="box-title" fill="#047857">Transparent Model Proxy Layer</text>
    <text x="32" y="80" class="box-desc">&#x2022; UserProxy: Dispatches to MongooseUser or MemoryUser</text>
    <text x="32" y="96" class="box-desc">&#x2022; ProductProxy: Compound index query / fast memory filter</text>
    <text x="32" y="112" class="box-desc">&#x2022; OrderProxy: In-memory arrays / Mongoose collection</text>

    <line x1="390" y1="82" x2="440" y2="62" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <line x1="390" y1="82" x2="440" y2="102" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <text x="400" y="55" class="conn-label" fill="#047857">readyState === 1</text>
    <text x="400" y="115" class="conn-label" fill="#047857">Fallback</text>

    <rect x="480" y="42" width="300" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="495" y="65" class="box-title" fill="#047857">Primary: MongoDB Atlas / Local</text>
    <text x="495" y="85" class="box-desc">Mongoose 8.9 ODM &#x2022; Text Search Indexes</text>
    <text x="495" y="102" class="box-desc">Collections: users, products (10k), orders</text>

    <rect x="800" y="42" width="300" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="815" y="65" class="box-title" fill="#047857">Fallback: Embedded In-Memory Store</text>
    <text x="815" y="85" class="box-desc">store.js &#x2022; Zero-Config &#x2022; 10,000 Auto-Seeded SKUs</text>
    <text x="815" y="102" class="box-desc">Instant Sub-10ms Queries &#x2022; Zero Downtime</text>
  </g>

  <!-- TIER 5: PREDICTIVE INVENTORY & ANALYTICS ENGINE -->
  <g transform="translate(40, 665)" filter="url(#shadow)">
    <rect width="1120" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1120" height="28" rx="10" fill="#d97706" />
    <rect y="16" width="1120" height="12" fill="#d97706" />
    <text x="16" y="19" class="tier-title">TIER 5: PREDICTIVE DEMAND FORECASTING &amp; RESTOCKING SUBSYSTEM</text>

    <rect x="20" y="38" width="340" height="48" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <text x="32" y="56" class="box-title">Demand Velocity &amp; Run-Rate</text>
    <text x="32" y="72" class="box-desc">Tracks sales velocity across 6 Flipkart departments</text>

    <rect x="380" y="38" width="340" height="48" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <text x="392" y="56" class="box-title">Automated Low-Stock Trigger (stock &lt;= 5)</text>
    <text x="392" y="72" class="box-desc">Generates immediate stock-out alerts &amp; restock advice</text>

    <rect x="740" y="38" width="360" height="48" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <text x="752" y="56" class="box-title">Procured Quantity Model (Flipkart Sales)</text>
    <text x="752" y="72" class="box-desc">ML-informed reorder batch calculations for high-demand items</text>
  </g>
</svg>
